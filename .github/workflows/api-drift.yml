name: API Drift Check

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run contract tests against live API
        run: pnpm test -- __tests__/contract.test.ts
        env:
          BANKSYNC_API_URL: https://api.banksync.io
      - name: Update cached spec snapshot
        if: failure()
        run: |
          curl -sf https://api.banksync.io/openapi.json -o __tests__/fixtures/openapi-spec.json
          echo "::warning::API spec has drifted — review the diff below"
          git diff __tests__/fixtures/openapi-spec.json
